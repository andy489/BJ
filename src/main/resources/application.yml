spring:
  config:
    import:
      - optional:file:.env[.properties]
      - classpath:paytable-config.yml
  application:
    name: BJ
  main:
    banner-mode: off
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${DB_URL:jdbc:sqlite:pushdb.db}
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          shared-cache:
            mode: UNSPECIFIED
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  mvc:
    hidden-method:
      filter:
        enabled: true

google.recaptcha:
  enabled: ${RECAPTCHA_ENABLED:false}
  site: ${RECAPTCHA_SITE_KEY:6LftLZQpAAAAABngcJW_QJ-hZ3XCfb8GqAisD0s5}
  secret: ${RECAPTCHA_SITE_SECRET:6LftLZQpAAAAAOo1uLD7ocJ_TudnvG578TfkAGK3}

auth:
  register:
    auto-login: false
  login:
    remember-me-key: ${REMEMBER_ME_KEY:1234}
  activation-token:
    cleanup-cron: "*/60 */10 * * * *"
    expires-after-minutes: 60
  forgot-password-token:
    cleanup-cron: "*/60 */10 * * * *"
    expires-after-minutes: 30

# mail-hog local dev defaults; override via env vars for prod SMTP (e.g. Gmail port 587)
mail:
  app-mail: ${APP_MAIL:noreply@push365.com}
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  username: ${MAIL_USER:root}
  password: ${MAIL_PASS:root}
  smtp-auth: ${MAIL_SMTP_AUTH:false}
  transport-protocol: smtp
  starttls-enable: ${MAIL_STARTTLS:false}

game:
  blackjack:
    max-splits: 4
    show-card-shuffler: true
    result-display-ms: 2500
    # Change to any DeckScenario enum value for local dev testing; must stay RANDOM in prod.
    deck-scenario: RANDOM

logging:
  level:
    org:
      springframework:
        security: INFO