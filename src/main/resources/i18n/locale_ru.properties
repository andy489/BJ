# rules
rules.ng=Новая игра
rules.bj.p1=Блэкджек, или 21, — одна из самых популярных карточных игр в казино. Её легко освоить и интересно играть. Мы предлагаем блэкджек с двумя колодами, где карты раздаются из специальной коробки — «шу».
rules.bj.p2=В блэкджеке вы играете только против дилера. Игроки получают все карты рубашкой вниз, первая карта дилера открыта, вторая — закрыта. Цель — набрать больше очков, чем у дилера, не превышая 21. Если сумма карт превышает 21 — это «перебор» и ставка проигрывается. Валеты, дамы, короли и десятки считаются за 10. Туз может считаться как 1 или 11. Все остальные карты — по номиналу.
rules.bj.p3=После получения первых двух карт вы можете «остановиться» или «взять карту». «Остановиться» — значит быть достаточно близко к 21 и не брать больше карт. Чтобы взять карту, постучите по столу за своей ставкой. В нашем онлайн-варианте все жесты заменены кнопками.
rules.bj.p4=Если вы ближе к 21, чем дилер, — вы выигрываете сумму, равную вашей ставке. Если ваша рука меньше — проигрываете. Если у дилера «перебор» — вы тоже выигрываете. Ничья — это «пуш», ставка остаётся на столе.
rules.bj.p5=Если первые две карты в сумме дают 21 — туз с десяткой, валетом, дамой или королём — у вас «блэкджек». Блэкджек выплачивается 3 к 2, если у дилера его нет. При ничьей — «пуш».
rules.bj.ref=Для получения дополнительной информации посетите
