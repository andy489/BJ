rules.baccarat.p1=Баккара — одна из старейших и наиболее элегантных карточных игр казино, любимая в залах для высоких ставок по всему миру. Цель проста: поставить на то, чья рука — Игрока, Банкира или Ничья — окажется ближе к 9.
rules.baccarat.p2=Игроку и Банкиру раздаётся по две карты лицом вверх. Значения рук вычисляются по последней цифре суммы — 7 и 8 (15) даёт 5. Если рука равна 8 или 9 после первой раздачи, это называется Натурал и карты больше не берутся. В противном случае строгое правило третьей карты определяет, получит ли одна или обе руки дополнительную карту — игрок сам решения о добросе не принимает.
rules.baccarat.p3=Выигрышные ставки на Банкира платят 1:1 минус 5% комиссии казино. Выигрышные ставки на Игрока платят 1:1 без комиссии. Ставка на Ничью платит 8:1, но имеет значительно более высокое преимущество казино и опытные игроки, как правило, её избегают.
rules.baccarat.p4=Поскольку правила добора полностью автоматические, баккара не требует стратегии — что делает её одной из самых чистых игр случая и идеальным дополнением к блэкджеку в нашем казино.
