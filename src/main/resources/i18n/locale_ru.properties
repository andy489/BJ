rules.poker.p1=Техасский холдем — самый популярный вариант покера в мире, именно в него играют на Мировой серии покера и бесчисленных телетурнирах. Каждый игрок получает две закрытые карты и комбинирует их с пятью общими картами, открываемыми поэтапно, чтобы составить лучшую возможную руку из пяти карт.
rules.poker.p2=Торговля происходит в четыре раунда: Префлоп (после раздачи закрытых карт), Флоп (после первых трёх общих карт), Тёрн (после четвёртой) и Ривер (после пятой). На каждой улице игрок может Чекнуть, Поставить, Коллировать, Рейзнуть или Сбросить.
rules.poker.p3=Если после последнего раунда торговли остаётся более одного игрока, происходит Вскрытие — игрок с наивысшей комбинацией из пяти карт забирает весь банк. При равенстве банк делится поровну.
rules.poker.p4=В отличие от блэкджека или баккары, техасский холдем — это игра мастерства, психологии и вероятности. Владение рейтингом рук, позицией, потовыми шансами и чтением соперников отличает стабильных победителей от остальных игроков за столом.
