rules.baccarat.ref.card.values=Стойности на картите
rules.baccarat.ref.card.values.val=Ас = 1 · 2–9 = номинал · 10/J/Q/K = 0
rules.baccarat.p1=Бакара е една от най-старите и елегантни казино игри с карти, предпочитана от хай-ролъри по целия свят. Целта е проста: заложи дали ръката на Играча, ръката на Банкера или Равенство ще е по-близо до 9.
rules.baccarat.p2=На Играча и Банкера се раздават по две карти с лице нагоре. Стойностите на ръцете се изчисляват по последната цифра на сумата — например 7 и 8 (15) дава 5. Ако някоя от ръцете е 8 или 9 след първото раздаване, се счита за Натурал и не се теглят повече карти. В противен случай строго правило за трета карта определя дали едната или двете ръце получават допълнителна карта — играчът никога не взима решение за теглене сам.
rules.baccarat.p3=Печелившите залози на Банкера изплащат 1:1 минус 5% комисионна на казиното. Печелившите залози на Играча изплащат 1:1 без комисионна. Залогът за Равенство плаща 8:1, но носи значително по-висока предимство за казиното и обикновено се счита за слаб залог от опитните играчи.
rules.baccarat.p4=Тъй като правилата за теглене са напълно автоматични, Бакара не изисква стратегия — което го прави една от най-чистите игри на шанс и идеален спътник на Блекджек в нашето казино.
