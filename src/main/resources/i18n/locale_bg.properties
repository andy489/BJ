rules.poker.p1=Texas Hold'em е най-популярният вариант на покер в света — играта, играна на Световната серия по покер и безброй телевизирани турнири. На всеки играч се раздават две скрити карти, които комбинира с пет общи карти, разкривани на етапи, за да направи най-добрата петкарткова комбинация.
rules.poker.p2=Залагането протича в четири рунда: Пре-флоп (след раздаването на скритите карти), Флоп (след първите три общи карти), Търн (след четвъртата) и Ривър (след петата). На всеки рунд играчът може да Чекне, Заложи, Кол-не, Рейзне или Фолдне.
rules.poker.p3=Ако след последния рунд на залагане остане повече от един играч, се стига до Шоудаун — играчът с най-високо рангираната петкарткова комбинация печели целия пот. При равенство потът се разделя.
rules.poker.p4=За разлика от Блекджек или Бакара, Texas Hold'em е игра на умение, психология и вероятности. Овладяването на класацията на ръцете, позицията, шансовете на пота и четенето на опонентите отделя последователните победители от останалите на масата.
