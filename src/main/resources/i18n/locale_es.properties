# rules
rules.ng=Nueva partida
rules.bj.p1=El Blackjack, o 21, es uno de los juegos de cartas más populares en los casinos. Es fácil de aprender y emocionante de jugar. Ofrecemos Blackjack de dos mazos, donde las cartas se reparten desde una caja llamada "zapato".
rules.bj.p2=En el Blackjack juegas solo contra el crupier. Los jugadores reciben todas las cartas boca arriba, la primera carta del crupier está boca arriba y la segunda boca abajo. El objetivo es acercarse más a 21 que el crupier sin pasarse. Si una mano supera 21, se llama "pasarse" y la apuesta se pierde. Jotas, Reinas, Reyes y 10 cuentan como 10. Un As puede valer 1 u 11. Todas las demás cartas se juegan a su valor nominal.
rules.bj.p3=Cuando recibes tus primeras dos cartas, puedes "plantarte" o "pedir". Cuando te "plantas", significa que estás lo suficientemente cerca de 21 y no deseas más cartas. Si deseas otra carta, toca la mesa detrás de tu apuesta. En nuestro caso en línea, todas las señales de mano se representan como botones.
rules.bj.p4=Si estás más cerca de 21 que el crupier, ganas y recibes una cantidad igual a tu apuesta original. Si tu mano es menor que la del crupier, pierdes. Si la mano del crupier se "pasa", también ganas. Los empates son un "push" y tu apuesta permanece en la mesa.
rules.bj.p5=Si tus primeras dos cartas suman 21 — un As con un 10, Jota, Reina o Rey — tienes Blackjack. El Blackjack paga 3 a 2 si el crupier no tiene uno. En caso de empate es un push.
rules.bj.ref=Para más información visita
