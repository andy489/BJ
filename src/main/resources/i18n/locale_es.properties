rules.poker.ref.showdown.val=La mejor mano de 5 cartas entre 7 gana el bote
rules.poker.p1=Texas Hold'em es la variante de póker más popular del mundo — el juego de las World Series of Poker y innumerables torneos televisados. Cada jugador recibe dos cartas privadas y las combina con cinco cartas comunitarias reveladas por etapas para formar la mejor mano de cinco cartas posible.
rules.poker.p2=Las apuestas se realizan en cuatro rondas: Pre-Flop (tras repartir las cartas privadas), Flop (tras las tres primeras cartas comunitarias), Turn (tras la cuarta) y River (tras la quinta). En cada calle un jugador puede Pasar, Apostar, Igualar, Subir o Retirarse.
rules.poker.p3=Si tras la última ronda de apuestas queda más de un jugador, se produce el Showdown — el jugador con la combinación de cinco cartas de mayor rango gana todo el bote. Los empates dividen el bote a partes iguales.
rules.poker.p4=A diferencia del Blackjack o el Bacará, el Texas Hold'em es un juego de habilidad, psicología y probabilidad. Dominar las clasificaciones de manos, la posición, las probabilidades del bote y la lectura de los rivales separa a los ganadores consistentes del resto de la mesa.
