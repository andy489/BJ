rules.baccarat.p1=El bacará es uno de los juegos de cartas de casino más antiguos y elegantes, favorecido en salas VIP de todo el mundo. El objetivo es simple: apostar a si la mano del Jugador, la mano de la Banca o un Empate estará más cerca de 9.
rules.baccarat.p2=Se reparten dos cartas boca arriba al Jugador y a la Banca. Los valores de las manos se calculan tomando el último dígito del total — un 7 y un 8 (15) vale 5. Si alguna mano totaliza 8 o 9 en el primer reparto, se denomina Natural y no se roban más cartas. En caso contrario, una regla estricta de tercera carta determina si una o ambas manos reciben una carta adicional — el jugador nunca toma la decisión de robar.
rules.baccarat.p3=Las apuestas ganadoras a la Banca pagan 1:1 menos un 5 % de comisión de la casa. Las apuestas ganadoras al Jugador pagan 1:1 sin comisión. Una apuesta de Empate paga 8:1 pero tiene una ventaja de la casa significativamente mayor y generalmente se considera una mala apuesta entre jugadores experimentados.
rules.baccarat.p4=Como las reglas de robo son completamente automáticas, el bacará no requiere estrategia, lo que lo convierte en uno de los juegos de azar más puros y un acompañante ideal del Blackjack en nuestro casino.
