rules.poker.ref.showdown=Showdown
rules.poker.ref.showdown.val=La migliore mano di 5 carte tra 7 vince il piatto
rules.poker.p1=Il Texas Hold'em è la variante di poker più popolare al mondo — il gioco disputato alle World Series of Poker e in innumerevoli tornei televisivi. Ogni giocatore riceve due carte private e le combina con cinque carte comuni rivelate a fasi per formare la migliore mano di cinque carte possibile.
rules.poker.p2=Le puntate avvengono in quattro round: Pre-Flop (dopo la distribuzione delle carte private), Flop (dopo le prime tre carte comuni), Turn (dopo la quarta) e River (dopo la quinta). In ogni turno un giocatore può Passare, Puntare, Chiamare, Rilanciare o Abbandonare.
rules.poker.p3=Se dopo l'ultimo round di puntate rimane più di un giocatore, si arriva allo Showdown — il giocatore con la combinazione di cinque carte di grado più alto vince l'intero piatto. In caso di parità il piatto viene diviso equamente.
rules.poker.p4=A differenza del Blackjack o del Baccarat, il Texas Hold'em è un gioco di abilità, psicologia e probabilità. Padroneggiare le classifiche delle mani, la posizione, le probabilità del piatto e la lettura degli avversari separa i vincitori costanti dal resto del tavolo.
