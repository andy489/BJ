rules.baccarat.p1=Il baccarat è uno dei giochi di carte da casinò più antichi ed eleganti, apprezzato nelle sale VIP di tutto il mondo. L'obiettivo è semplice: scommettere se la mano del Giocatore, la mano del Banco o un Pareggio si avvicinerà di più a 9.
rules.baccarat.p2=Al Giocatore e al Banco vengono distribuite due carte scoperte ciascuno. I valori delle mani si calcolano prendendo l'ultima cifra del totale — 7 e 8 (15) vale 5. Se una mano totalizza 8 o 9 al primo banco, viene chiamata Naturale e non si pescano altre carte. Altrimenti, una regola rigorosa per la terza carta determina se una o entrambe le mani ricevono una carta aggiuntiva — il giocatore non prende mai la decisione di pescare.
rules.baccarat.p3=Le puntate vincenti sul Banco pagano 1:1 meno una commissione del 5% della casa. Le puntate vincenti sul Giocatore pagano 1:1 senza commissione. Una puntata sul Pareggio paga 8:1 ma ha un vantaggio della casa significativamente più alto ed è generalmente considerata una puntata da evitare dai giocatori esperti.
rules.baccarat.p4=Poiché le regole di pescata sono completamente automatiche, il baccarat non richiede strategia — rendendolo uno dei giochi d'azzardo più puri e un compagno ideale del Blackjack nel nostro casinò.
