# rules
rules.ng=Nuova partita
rules.bj.p1=Il Blackjack, o 21, è uno dei giochi di carte più popolari nei casinò. È facile da imparare ed emozionante da giocare. Offriamo Blackjack a due mazzi, dove le carte vengono distribuite da una scatola chiamata "scarpa".
rules.bj.p2=Nel Blackjack giochi solo contro il banco. I giocatori ricevono tutte le carte scoperte, la prima carta del banco è scoperta e la seconda è coperta. L'obiettivo è avvicinarsi a 21 più del banco senza superarlo. Se una mano supera 21, si chiama "sballare" e la puntata è persa. Jack, Regine, Re e 10 valgono 10. Un Asso può valere 1 o 11. Tutte le altre carte valgono il loro valore nominale.
rules.bj.p3=Quando ricevi le prime due carte, puoi "stare" o "chiedere". Quando "stai", significa che sei abbastanza vicino a 21 e non desideri altre carte. Se vuoi un'altra carta, tocca o graffia il tavolo dietro la tua puntata. In entrambi i casi, non toccherai mai le carte; tutto viene comunicato con segnali manuali. Nel nostro caso online, tutti i segnali manuali sono rappresentati come pulsanti.
rules.bj.p4=Se sei più vicino a 21 del banco, vinci e ricevi una somma pari alla tua puntata originale. Se la tua mano è inferiore a quella del banco, perdi. Se la mano del banco "sballa", vinci anche tu. I pareggi sono un "push" e la tua puntata rimane sul tavolo.
rules.bj.p5=Se le tue prime due carte totalizzano 21 — un Asso con un 10, Jack, Regina o Re — hai un Blackjack. Il Blackjack paga 3 a 2 se il banco non ce l'ha. In caso di parità è un push.
rules.bj.ref=Per ulteriori informazioni visita
