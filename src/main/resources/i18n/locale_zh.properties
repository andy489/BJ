# rules
rules.ng=新游戏
rules.bj.p1=二十一点，又称21点，是赌场中最受欢迎的纸牌游戏之一。易于学习，令人兴奋。我们提供双副牌二十一点，牌从称为"牌靴"的盒子中发出。
rules.bj.p2=在二十一点中，您只与荷官对决。玩家的牌全部正面朝上，荷官第一张牌正面朝上，第二张朝下。目标是比荷官更接近21点而不超过。超过21点称为"爆牌"，赌注即告输掉。J、Q、K和10均算10点。A可算1或11。其他牌按面值计算。
rules.bj.p3=拿到前两张牌后，您可以选择"停牌"或"要牌"。"停牌"意味着您已足够接近21点，不需要更多牌。要"要牌"，请敲击桌面。在我们的在线版本中，所有手势均以按钮表示。
rules.bj.p4=如果您比荷官更接近21点，您赢得与原始赌注等额的金额。如果您的牌点低于荷官，您输掉赌注。如果荷官爆牌，您也赢。平局为"推注"，赌注留在桌上。
rules.bj.p5=如果您的前两张牌合计为21点——A加10、J、Q或K——您获得"二十一点"。二十一点以3比2赔付（荷官无二十一点时）。平局时为推注。
rules.bj.ref=更多信息请访问
