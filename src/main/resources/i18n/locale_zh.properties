rules.baccarat.p1=百家乐是最古老、最优雅的赌场纸牌游戏之一，深受全球高额赌客青睐。规则简单：押注闲家手牌、庄家手牌或和局哪方更接近9点。
rules.baccarat.p2=闲家和庄家各发两张明牌。手牌点数取总和的个位数 — 例如7和8（15）得5点。如果任何一方在初始发牌后手牌为8或9，则称为天牌，不再补牌。否则，严格的第三张牌规则决定一方或双方是否补牌 — 玩家无需自行决定是否要牌。
rules.baccarat.p3=押庄家赢的赌注按1:1赔付，但需支付5%抽成。押闲家赢的赌注按1:1赔付，无需抽成。押和局赔率为8:1，但庄家优势明显更高，经验丰富的玩家通常将其视为不划算的赌注。
rules.baccarat.p4=由于补牌规则完全自动，百家乐无需任何策略，是最纯粹的运气游戏之一，也是我们赌场中黑杰克的理想搭档。
# rules page — texas hold'em
rules.poker=德州扑克
rules.poker.ref.players=玩家人数
rules.poker.ref.players.val=每桌2至10人
rules.poker.ref.hand.cards=手牌
rules.poker.ref.hand.cards.val=每位玩家2张底牌
rules.poker.ref.community=公共牌
rules.poker.ref.community.val=5张共享牌（翻牌·转牌·河牌）
rules.poker.ref.best.hand=最佳牌型
rules.poker.ref.best.hand.val=皇家同花顺 → 高牌
rules.poker.ref.blinds=盲注
rules.poker.ref.blinds.val=发牌前下小盲+大盲
rules.poker.ref.showdown=摊牌
rules.poker.ref.showdown.val=7张牌中最佳5张赢得底池
rules.poker.p1=德州扑克是全球最受欢迎的扑克变体，也是世界扑克大赛及无数电视锦标赛的主要赛制。每位玩家获发两张私有底牌，并将其与分阶段亮出的五张公共牌组合，以构成最佳五张牌型。
rules.poker.p2=下注共分四轮：翻牌前（发底牌后）、翻牌（前三张公共牌后）、转牌（第四张后）和河牌（第五张后）。每轮玩家可选择过牌、下注、跟注、加注或弃牌。
rules.poker.p3=若最后一轮下注后仍有多名玩家，则进入摊牌阶段 — 持有最高五张牌型组合的玩家赢得全部底池。若平手则平分底池。
rules.poker.p4=与黑杰克或百家乐不同，德州扑克是一项融合技术、心理学和概率的竞技游戏。掌握牌型排名、位置、底池赔率以及读懂对手，是持续赢家与普通玩家的分水岭。
