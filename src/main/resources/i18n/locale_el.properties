rules.poker.p1=Το Texas Hold'em είναι η πιο δημοφιλής παραλλαγή πόκερ στον κόσμο — το παιχνίδι που παίζεται στο World Series of Poker και αμέτρητα τηλεοπτικά τουρνουά. Κάθε παίκτης λαμβάνει δύο ιδιωτικά κρυφά χαρτιά και τα συνδυάζει με πέντε κοινά χαρτιά που αποκαλύπτονται σταδιακά για να φτιάξει το καλύτερο δυνατό πενταχαρτικό χέρι.
rules.poker.p2=Το στοίχημα γίνεται σε τέσσερις γύρους: Pre-Flop (μετά το μοίρασμα κρυφών χαρτιών), Flop (μετά τα πρώτα τρία κοινά χαρτιά), Turn (μετά το τέταρτο) και River (μετά το πέμπτο). Σε κάθε φάση παίκτης μπορεί να κάνει Check, Bet, Call, Raise ή Fold.
rules.poker.p3=Αν παραμένουν περισσότεροι από ένας παίκτες μετά τον τελευταίο γύρο στοιχηματισμού, γίνεται Showdown — ο παίκτης με την υψηλότερη πενταχαρτική συνδυαστική κερδίζει ολόκληρο το pot. Οι ισοπαλίες μοιράζουν το pot εξίσου.
rules.poker.p4=Σε αντίθεση με το Blackjack ή το Baccarat, το Texas Hold'em είναι παιχνίδι δεξιοτεχνίας, ψυχολογίας και πιθανοτήτων. Η εξειδίκευση στις κατατάξεις χεριών, τη θέση, τα pot odds και την ανάγνωση αντιπάλων ξεχωρίζει τους σταθερά κερδίζοντες από τους υπόλοιπους στο τραπέζι.
