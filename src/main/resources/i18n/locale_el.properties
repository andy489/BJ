# rules
rules.ng=Νέο παιχνίδι
rules.bj.p1=Το Blackjack, ή 21, είναι ένα από τα πιο δημοφιλή χαρτοπαίγνια στα καζίνο. Είναι εύκολο να μάθεις και συναρπαστικό να παίξεις. Προσφέρουμε Blackjack δύο τραπουλών όπου τα χαρτιά μοιράζονται από ένα κουτί που ονομάζεται "shoe".
rules.bj.p2=Στο Blackjack παίζετε μόνο εναντίον του dealer. Οι παίκτες λαμβάνουν όλα τα χαρτιά με την εμπρόσθια όψη προς τα πάνω και το πρώτο χαρτί του dealer είναι ανοιχτό ενώ το δεύτερο είναι κρυφό. Στόχος είναι να πλησιάσετε το 21 περισσότερο από τον dealer χωρίς να το υπερβείτε. Αν μια χέρι υπερβεί το 21, λέγεται "bust" και το στοίχημα χάνεται. Στο 21, οι Βαλέδες, Ντάμες, Ρήγες και 10αρια μετρούν ως 10. Ο Άσσος μπορεί να παιχτεί ως 1 ή 11. Όλα τα άλλα χαρτιά παίζονται με την ονομαστική τους αξία.
rules.bj.p3=Όταν λάβετε τα πρώτα σας δύο χαρτιά, μπορείτε είτε να "σταθείτε" είτε να "χτυπήσετε". Το "σταθείτε" σημαίνει ότι είστε αρκετά κοντά στο 21 και δεν επιθυμείτε άλλα χαρτιά. Αν επιθυμείτε άλλο χαρτί, επιλέξτε "χτυπήστε". Στην online έκδοσή μας, όλες οι επιλογές αναπαρίστανται ως κουμπιά. Μπορείτε να τραβήξετε όσα χαρτιά θέλετε μέχρι να πλησιάσετε το 21 ή να κάνετε "bust".
rules.bj.p4=Αν είστε πιο κοντά στο 21 από τον dealer, κερδίζετε και πληρώνεστε ποσό ίσο με το αρχικό σας στοίχημα. Αν η χέρι σας είναι μικρότερη από του dealer, χάνετε. Αν η χέρι του dealer κάνει "bust", κερδίζετε επίσης. Οι ισοπαλίες είναι "push" και το στοίχημά σας παραμένει στο τραπέζι.
rules.bj.p5=Αν τα αρχικά σας δύο χαρτιά συνολίζουν 21 — οποιοσδήποτε Άσσος με 10, Βαλέ, Ντάμα ή Ρήγα — έχετε Blackjack. Το Blackjack πληρώνεται 3 προς 2 αν ο dealer δεν έχει επίσης. Σε ισοπαλία είναι push.
rules.bj.ref=Για περισσότερες πληροφορίες επισκεφτείτε
