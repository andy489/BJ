rules.baccarat.p1=Το Baccarat είναι ένα από τα παλαιότερα και πιο κομψά παιχνίδια καρτών στο καζίνο, αγαπημένο σε αίθουσες υψηλού στοιχήματος παγκοσμίως. Ο στόχος είναι απλός: στοίχημα στο ποιο χέρι — του Παίκτη, του Banker, ή Ισοπαλία — θα είναι πιο κοντά στο 9.
rules.baccarat.p2=Δύο χαρτιά μοιράζονται ανοιχτά τόσο στον Παίκτη όσο και στον Banker. Οι αξίες χεριών υπολογίζονται λαμβάνοντας το δεξιότερο ψηφίο του αθροίσματος — έτσι το 7 και το 8 (15) βαθμολογείται ως 5. Αν οποιοδήποτε χέρι φτάσει 8 ή 9 στην πρώτη μοιρασιά ονομάζεται Natural και δεν τραβιούνται άλλα χαρτιά. Διαφορετικά, αυστηρός κανόνας τρίτου χαρτιού καθορίζει αν ένα ή και τα δύο χέρια λάβουν επιπλέον χαρτί — ο παίκτης δεν λαμβάνει μόνος του αποφάσεις σχετικά με το τράβηγμα.
rules.baccarat.p3=Οι νικηφόρες στοιχηματισμοί στον Banker πληρώνουν 1:1 μείον προμήθεια 5% του σπιτιού. Οι νικηφόρες στοιχηματισμοί στον Παίκτη πληρώνουν 1:1 χωρίς προμήθεια. Το στοίχημα Ισοπαλίας πληρώνει 8:1 αλλά έχει σημαντικά υψηλότερο πλεονέκτημα σπιτιού και γενικά θεωρείται κακή επιλογή από έμπειρους παίκτες.
rules.baccarat.p4=Επειδή οι κανόνες τραβήγματος είναι πλήρως αυτόματοι, το Baccarat δεν απαιτεί στρατηγική — καθιστώντας το ένα από τα πιο καθαρά τυχερά παιχνίδια στη σάλα και ιδανικό συνοδό του Blackjack στο καζίνο μας.
