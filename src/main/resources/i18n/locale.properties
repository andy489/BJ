rules.baccarat.p1=Baccarat is one of the oldest and most elegant casino card games, favoured in high-roller rooms worldwide. The goal is simple: bet on whether the Player hand, the Banker hand, or a Tie will end closer to a total of 9.
rules.baccarat.p2=Two cards are dealt face-up to both the Player and the Banker. Hand values are calculated by taking the rightmost digit of the total — so a 7 and an 8 (15) scores 5. If either hand totals 8 or 9 on the first deal it is called a Natural and no further cards are drawn. Otherwise, a strict third-card drawing rule determines whether one or both hands receive an additional card — the player never makes a drawing decision themselves.
rules.baccarat.p3=Winning bets on the Banker hand pay 1:1 minus a 5% house commission. Winning bets on the Player hand pay 1:1 with no commission. A Tie bet pays 8:1 but carries a significantly higher house edge and is generally considered a sucker bet by experienced players.
rules.baccarat.p4=Because the drawing rules are fully automatic, Baccarat requires no strategy — making it one of the purest games of chance on the floor and an ideal companion to Blackjack in our casino.
