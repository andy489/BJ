rules.poker.p1=Texas Hold'em is the world's most popular poker variant — the game played in the World Series of Poker and countless televised tournaments. Each player is dealt two private hole cards and combines them with five community cards revealed in stages to make the best possible five-card hand.
rules.poker.p2=Betting occurs in four rounds: Pre-Flop (after hole cards are dealt), Flop (after the first three community cards), Turn (after the fourth), and River (after the fifth). On each street a player may Check, Bet, Call, Raise, or Fold.
rules.poker.p3=If more than one player remains after the final betting round, a Showdown takes place — the player holding the highest-ranked five-card combination wins the entire pot. Ties split the pot equally.
rules.poker.p4=Unlike Blackjack or Baccarat, Texas Hold'em is a game of skill, psychology, and probability. Mastering hand rankings, position, pot odds, and reading opponents separates consistent winners from the rest of the table.
