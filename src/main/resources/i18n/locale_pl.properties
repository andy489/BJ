rules.baccarat.p1=Baccarat to jedna z najstarszych i najbardziej eleganckich gier karcianych w kasynie, ceniona w salonach dla VIP-ów na całym świecie. Cel jest prosty: obstawiaj czy ręka Gracza, ręka Bankera czy Remis zbliży się bardziej do 9.
rules.baccarat.p2=Zarówno Gracz jak i Banker otrzymują dwie odkryte karty. Wartości rąk oblicza się biorąc ostatnią cyfrę sumy — 7 i 8 (15) daje 5. Jeśli któraś ręka osiągnie 8 lub 9 po pierwszym rozdaniu, jest to Natural i nie dobiera się więcej kart. W przeciwnym razie ścisłe zasady trzeciej karty określają czy jedna lub obie ręce otrzymają dodatkową kartę — gracz sam nie podejmuje decyzji o dobieraniu.
rules.baccarat.p3=Wygrywające zakłady na Bankera wypłacają 1:1 minus 5% prowizji domu. Wygrywające zakłady na Gracza wypłacają 1:1 bez prowizji. Zakład na Remis wypłaca 8:1, ale ma znacznie wyższą przewagę domu i jest ogólnie uważany za niekorzystny przez doświadczonych graczy.
rules.baccarat.p4=Ponieważ zasady dobierania są w pełni automatyczne, Baccarat nie wymaga strategii — co czyni go jedną z czystszych gier losowych na sali i idealnym uzupełnieniem Blackjacka w naszym kasynie.
