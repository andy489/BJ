# rules
rules.ng=Nowa gra
rules.bj.p1=Blackjack, czyli 21, to jedna z najpopularniejszych gier karcianych w kasynach. Jest łatwa do nauczenia i ekscytująca w rozgrywce. Oferujemy Blackjacka z dwoma taliami, gdzie karty są rozdawane z pojemnika zwanego "shoe".
rules.bj.p2=W Blackjacku grasz tylko przeciwko krupierowi. Gracze otrzymują wszystkie karty zakryte, pierwsza karta krupiera jest odkryta, a druga zakryta. Celem gry jest zbliżenie się do 21 bliżej niż krupier, nie przekraczając 21. Jeśli ręka przekroczy 21, nazywa się to "bust" i zakład jest przegrany. Walet, Dama, Król i 10 liczą jako 10. As może być grany jako 1 lub 11. Wszystkie pozostałe karty są grane według wartości nominalnej.
rules.bj.p3=Gdy otrzymasz swoje pierwsze dwie karty, możesz "stać" lub "dobierać". Gdy "stoisz", oznacza to, że jesteś wystarczająco blisko 21 i nie chcesz więcej kart. Jeśli chcesz dobrać kolejną kartę, dotknij stołu za swoim zakładem. W naszej wersji online wszystkie gesty są reprezentowane jako przyciski. Możesz dobierać tyle kart, ile chcesz, dopóki nie jesteś blisko 21 lub dopóki nie przekroczysz.
rules.bj.p4=Jeśli jesteś bliżej 21 niż krupier, wygrywasz i otrzymujesz kwotę równą swojemu pierwotnemu zakładowi. Jeśli Twoja ręka jest niższa niż ręka krupiera, przegrywasz. Jeśli ręka krupiera przekroczy 21, również wygrywasz. Remisy to "push" i Twój zakład pozostaje na stole.
rules.bj.p5=Jeśli Twoje pierwsze dwie karty sumują się do 21 — As z 10, Waletem, Damą lub Królem — masz Blackjacka. Blackjack jest wypłacany 3 do 2, jeśli krupier go nie ma. W przypadku remisu to push.
