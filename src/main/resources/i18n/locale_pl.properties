rules.poker.ref.showdown=Showdown
rules.poker.ref.showdown.val=Najlepsza ręka 5-kartowa z 7 wygrywa pulę
rules.poker.p1=Texas Hold'em to najpopularniejsza na świecie odmiana pokera — gra rozgrywana na World Series of Poker i niezliczonych turniejach telewizyjnych. Każdy gracz otrzymuje dwie prywatne zakryte karty i łączy je z pięcioma kartami wspólnymi ujawnianymi etapami, tworząc najlepszą możliwą rękę pięciokartową.
rules.poker.p2=Licytacja odbywa się w czterech rundach: Pre-Flop (po rozdaniu zakrytych kart), Flop (po pierwszych trzech kartach wspólnych), Turn (po czwartej) i River (po piątej). W każdej rundzie gracz może Sprawdzić, Podbić, Wyrównać, Przebić lub Spasować.
rules.poker.p3=Jeśli po ostatniej rundzie licytacji pozostaje więcej niż jeden gracz, odbywa się Showdown — gracz z najwyżej ocenioną kombinacją pięciu kart wygrywa całą pulę. Remisy dzielą pulę równo.
rules.poker.p4=W przeciwieństwie do Blackjacka czy Baccarat, Texas Hold'em to gra wymagająca umiejętności, psychologii i rachunku prawdopodobieństwa. Opanowanie układów kart, pozycji, odds puli i czytania przeciwników oddziela konsekwentnych zwycięzców od reszty stołu.
