rules.poker.ref.showdown.val=7枚から最良の5枚のハンドがポットを獲得
rules.poker.p1=テキサスホールデムは世界で最も人気のあるポーカーのバリアント — ワールドシリーズオブポーカーや数多くのテレビトーナメントで行われるゲームです。各プレイヤーは2枚のプライベートホールカードを受け取り、段階的に公開される5枚のコミュニティカードと組み合わせて最良の5枚のハンドを作ります。
rules.poker.p2=ベッティングは4ラウンドで行われます：プリフロップ（ホールカードが配られた後）、フロップ（最初の3枚のコミュニティカードの後）、ターン（4枚目の後）、リバー（5枚目の後）。各ストリートでプレイヤーはチェック、ベット、コール、レイズ、フォールドを選べます。
rules.poker.p3=最後のベッティングラウンド後に複数のプレイヤーが残った場合、ショーダウンが行われます。最高ランクの5枚の組み合わせを持つプレイヤーがポット全体を獲得します。同点の場合はポットを均等に分けます。
rules.poker.p4=ブラックジャックやバカラとは異なり、テキサスホールデムは技術、心理、確率のゲームです。ハンドのランキング、ポジション、ポットオッズ、相手の読み取りをマスターすることが、一貫した勝者とテーブルの残りを分けます。
