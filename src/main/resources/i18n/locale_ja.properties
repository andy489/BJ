# rules
rules.ng=新しいゲーム
rules.bj.p1=ブラックジャック（21とも呼ばれる）は、カジノで最も人気のあるカードゲームの一つです。学びやすく、エキサイティングなゲームです。当カジノでは「シュー」と呼ばれるケースからカードを配る2デッキブラックジャックを提供しています。
rules.bj.p2=ブラックジャックではディーラーとのみ対戦します。プレイヤーはすべてのカードを表向きに受け取り、ディーラーの最初のカードは表向き、2枚目は裏向きです。21を超えずにディーラーより21に近づくことが目標です。手札が21を超えると「バスト」となり賭け金を失います。J、Q、K、10は10として数えます。Aは1または11として使えます。その他のカードは額面通りに計算します。
rules.bj.p3=最初の2枚を受け取ったら、「スタンド」または「ヒット」を選べます。「スタンド」は21に十分近いと判断してカードを要求しないことを意味します。もう1枚引く場合は「ヒット」を選択します。当オンラインカジノではすべての手のサインがボタンとして表示されます。21に近づくか、バストするまで何枚でも引き続けることができます。
rules.bj.p4=ディーラーより21に近い場合、元の賭け金と同額が支払われます。ディーラーの方が強い場合は負けです。ディーラーがバストした場合も勝利です。同点は「プッシュ」となり、賭け金はテーブルに残ります。
rules.bj.p5=最初の2枚の合計が21（AとJ・Q・K・10の組み合わせ）の場合、ブラックジャックです。ディーラーにブラックジャックがなければ3対2で支払われます。同点の場合はプッシュです。
rules.bj.ref=詳細はこちらをご覧ください
