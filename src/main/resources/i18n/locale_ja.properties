rules.baccarat.p1=バカラは世界中のハイローラールームで愛される、最も古くてエレガントなカジノカードゲームの一つです。目標はシンプルです：プレイヤーの手、バンカーの手、またはタイのどれが9に近くなるかを賭けるゲームです。
rules.baccarat.p2=プレイヤーとバンカーの両方に2枚のカードが表向きに配られます。手の値は合計の1の位で計算されます。7と8（15）は5になります。最初の配りで8または9になった場合はナチュラルと呼ばれ、追加のカードは引きません。それ以外の場合は厳格な3枚目のカードのルールが適用されます。プレイヤー自身が引くかどうかを決める必要はありません。
rules.baccarat.p3=バンカーに勝ったベットは1対1の配当から5%の手数料が引かれます。プレイヤーに勝ったベットは手数料なしで1対1の配当です。タイベットは8対1ですが、ハウスエッジが大幅に高く、経験豊富なプレイヤーからは一般的に敬遠されています。
rules.baccarat.p4=引くルールが完全に自動化されているため、バカラには戦略が必要ありません。これにより最も純粋な運のゲームの一つとなり、当カジノのブラックジャックの理想的な仲間となっています。
