# rules
rules.ng=Neues Spiel
rules.bj.p1=Blackjack, oder 21, ist eines der beliebtesten Kartenspiele in Casinos. Es ist leicht zu erlernen und aufregend zu spielen. Wir bieten Zwei-Deck-Blackjack an, bei dem die Karten aus einer Box namens "Shoe" ausgeteilt werden.
rules.bj.p2=Beim Blackjack spielen Sie nur gegen den Dealer. Die Spieler erhalten alle Karten mit der Vorderseite nach oben, die erste Karte des Dealers liegt offen, die zweite verdeckt. Ziel ist es, näher an 21 heranzukommen als der Dealer, ohne 21 zu überschreiten. Überschreitet eine Hand 21, wird dies als "Bust" bezeichnet und der Einsatz ist verloren. Buben, Damen, Könige und 10er zählen als 10. Ein Ass kann als 1 oder 11 gespielt werden. Alle anderen Karten werden zum Nennwert gespielt.
rules.bj.p3=Wenn Sie Ihre ersten zwei Karten erhalten, können Sie entweder "stehen" oder "ziehen". Wenn Sie "stehen", bedeutet das, dass Sie nah genug an 21 sind und keine weiteren Karten wünschen. Wenn Sie eine weitere Karte ziehen möchten, tippen Sie auf den Tisch hinter Ihrem Einsatz. In unserem Online-Fall werden alle Handzeichen als Schaltflächen dargestellt.
rules.bj.p4=Wenn Sie näher an 21 sind als der Dealer, gewinnen Sie und erhalten einen Betrag in Höhe Ihres ursprünglichen Einsatzes. Wenn Ihre Hand niedriger ist als die des Dealers, verlieren Sie. Wenn die Hand des Dealers "bust" ist, gewinnen Sie ebenfalls. Unentschieden sind ein "Push" und Ihr Einsatz bleibt auf dem Tisch.
rules.bj.p5=Wenn Ihre ersten zwei Karten insgesamt 21 ergeben — ein Ass mit einer 10, einem Buben, einer Dame oder einem König — haben Sie Blackjack. Blackjack wird 3 zu 2 ausgezahlt, wenn der Dealer keinen hat. Bei Gleichstand ist es ein Push.
rules.bj.ref=Für weitere Informationen besuchen Sie
