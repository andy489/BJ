rules.baccarat.p1=Baccarat ist eines der ältesten und elegantesten Kartenkasino-Spiele, das in High-Roller-Räumen weltweit beliebt ist. Das Ziel ist einfach: Setze darauf, ob die Hand des Spielers, die Hand des Bankers oder ein Unentschieden näher an 9 liegt.
rules.baccarat.p2=Sowohl Spieler als auch Banker erhalten zwei offen liegende Karten. Handwerte werden durch die letzte Stelle der Summe berechnet — 7 und 8 (15) ergibt 5. Wenn eine Hand nach dem ersten Austeilen 8 oder 9 erreicht, gilt dies als Natural und es werden keine weiteren Karten gezogen. Andernfalls bestimmt eine strenge Dritte-Karte-Regel, ob eine oder beide Hände eine zusätzliche Karte erhalten — der Spieler trifft selbst keine Ziehentscheidung.
rules.baccarat.p3=Gewinnende Wetten auf den Banker zahlen 1:1 abzüglich 5 % Hausprovision. Gewinnende Wetten auf den Spieler zahlen 1:1 ohne Provision. Eine Unentschieden-Wette zahlt 8:1, hat aber einen deutlich höheren Hausvorteil und wird von erfahrenen Spielern meist gemieden.
rules.baccarat.p4=Da die Ziehregeln vollständig automatisch ablaufen, erfordert Baccarat keine Strategie — was es zu einem der reinsten Glücksspiele macht und einem idealen Begleiter für Blackjack in unserem Casino.
