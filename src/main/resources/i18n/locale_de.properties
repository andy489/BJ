rules.poker.p1=Texas Hold'em ist die weltweit beliebteste Pokervariante — das Spiel, das bei der World Series of Poker und zahllosen TV-Turnieren gespielt wird. Jeder Spieler erhält zwei private verdeckte Karten und kombiniert sie mit fünf Gemeinschaftskarten, die phasenweise aufgedeckt werden, um die bestmögliche Fünf-Karten-Hand zu bilden.
rules.poker.p2=Das Setzen erfolgt in vier Runden: Pre-Flop (nach dem Austeilen der verdeckten Karten), Flop (nach den ersten drei Gemeinschaftskarten), Turn (nach der vierten) und River (nach der fünften). In jeder Runde kann ein Spieler Checken, Setzen, Callen, Raisen oder Folden.
rules.poker.p3=Wenn nach der letzten Setzrunde mehr als ein Spieler übrig bleibt, kommt es zum Showdown — der Spieler mit der am höchsten eingestuften Fünf-Karten-Kombination gewinnt den gesamten Pot. Bei Gleichstand wird der Pot aufgeteilt.
rules.poker.p4=Anders als Blackjack oder Baccarat ist Texas Hold'em ein Spiel aus Können, Psychologie und Wahrscheinlichkeit. Die Beherrschung von Handrankings, Position, Pot-Odds und das Lesen von Gegnern trennt konsequente Gewinner vom Rest des Tisches.
