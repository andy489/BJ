services:
  # MailHog — local SMTP + web UI for dev email testing
  # Start with: docker-compose up -d
  # Web UI: http://localhost:8025
  # Uncomment MAIL_* vars in .env to activate
  mailhog:
    image: jcalonso/mailhog
    logging:
      driver: 'none'
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

